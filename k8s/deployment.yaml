apiVersion: apps/v1
kind: Deployment
metadata:
  name: studypilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studypilot
  template:
    metadata:
      labels:
        app: studypilot
    spec:
      containers:
        - name: studypilot
          image: studypilot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
